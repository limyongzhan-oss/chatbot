<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site manpower and worker health declaration</title>
<style>
:root{--bg:#f4f5f7;--surface:#fff;--ink:#16202c;--muted:#5d6b7a;--line:#e2e6eb;--brand:#1d3a5f;--accent:#f08a24;--good:#1f8a5b;--bad:#c8372d;--bad-bg:#fdeceb;--warn-bg:#fff4e5;--bar:#2f6fb3;--radius:10px;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--bar);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
h1,h2,h3{margin:0;line-height:1.2}h1{font-size:22px}h2{font-size:16px}
.muted{color:var(--muted)}.small{font-size:13px}.tnum{font-variant-numeric:tabular-nums}.hidden{display:none!important}
.demo-banner{background:var(--warn-bg);color:#7a4300;font-size:13px;padding:6px 12px;text-align:center;border-bottom:1px solid #f0d3a8}
.demo-banner button{font:inherit;font-size:12px;margin-left:8px;border:1px solid #d9a85f;background:#fff;color:#7a4300;border-radius:6px;padding:1px 8px;cursor:pointer}
.topbar{background:var(--brand);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;color:#fff}.brand:hover{text-decoration:none}
.topbar .who{margin-left:auto;font-size:13px;opacity:.9;display:flex;gap:12px;align-items:center}
.topbar button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}
.page{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:16px}
.head .grow{flex:1 1 280px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.crumbs a{color:var(--muted)}
.grid{display:grid;gap:16px}.cols-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.card h2{margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{white-space:nowrap;display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--line);color:var(--ink)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:#9a5200}.pill.good{background:#e6f4ed;color:var(--good)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .label{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.kpi .value{font-size:30px;font-weight:700;margin-top:2px}.kpi .sub{font-size:13px;color:var(--muted)}
.kpi.bad .value{color:var(--bad)}.kpi.warn .value{color:#b86200}
.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.barcell{width:32%;min-width:120px}.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar>div{height:100%;background:var(--bar)}
.empty{color:var(--muted);padding:12px 0;font-size:14px}.list{max-height:420px;overflow:auto}
form.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid #c9d0d8;border-radius:8px;padding:8px 10px}
textarea{width:100%;min-height:70px}
.btn{font:inherit;font-weight:600;cursor:pointer;border-radius:8px;padding:8px 14px;border:1px solid var(--brand);background:var(--brand);color:#fff;display:inline-block;text-align:center}
.btn:hover{text-decoration:none}.btn.ghost{background:#fff;color:var(--brand)}.btn.small{padding:3px 9px;font-size:13px;font-weight:500;white-space:nowrap}
.btn.big{width:100%;padding:14px;font-size:17px;display:block}.btn.danger{background:var(--bad);border-color:var(--bad)}.btn.good{background:var(--good);border-color:var(--good)}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.field{display:block;margin-bottom:14px;font-weight:600;font-size:14px}
label.field input,label.field textarea,label.field select{display:block;width:100%;margin-top:6px;font-weight:400}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.note{background:#e6f4ed;color:var(--good);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.chart svg{width:100%;height:auto;display:block}.chart .axis{font-size:10px;fill:var(--muted)}
.narrow{max-width:520px;margin:0 auto;padding:24px 16px 48px}
.q{font-weight:600;font-size:14px;margin:4px 0 0}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label{display:block;text-align:center;border:2px solid var(--line);border-radius:10px;padding:11px 8px;background:#fff;cursor:pointer;font-weight:600}
.choice input:checked+label{border-color:var(--brand);background:#eaf1f9}
.choice input.bad:checked+label{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.choice input.good:checked+label{border-color:var(--good);background:#e6f4ed;color:var(--good)}
.choice.one{grid-template-columns:1fr}
.sect{border-top:1px solid var(--line);margin:14px 0 10px;padding-top:12px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.big-status{text-align:center;padding:20px 8px}.big-status .icon{font-size:44px}.big-status h2{justify-content:center;margin-bottom:6px}
.phone{max-width:420px;margin:16px auto;border:10px solid #16202c;border-radius:36px;background:var(--bg);padding:16px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:2px;cursor:pointer;background:#fff;font:inherit;font-size:13px}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pv{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff;font-size:13px}
.pv .who{font-weight:700;margin-bottom:4px}.pv .ch{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:6px}
.pv.tg{background:#eaf3fb;border-color:#c5dcf0}.pv.wa{background:#e3f6dc;border-color:#bfe3b3}
.pv.email .hdr{color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px}
.sideinfo{max-width:460px;margin:0 auto;padding:0 16px 40px}
.seg{display:inline-flex;border:1px solid var(--brand);border-radius:8px;overflow:hidden}
.seg a{padding:7px 14px;font-weight:600;color:var(--brand);background:#fff}.seg a:hover{text-decoration:none}.seg a.on{background:var(--brand);color:#fff}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs a{flex:1;text-align:center;padding:9px;border:2px solid var(--line);border-radius:10px;font-weight:600;background:#fff;color:var(--ink)}
.tabs a.on{border-color:var(--brand);background:#eaf1f9}.tabs a:hover{text-decoration:none}
.pinbox{font-size:34px;font-weight:800;letter-spacing:8px;color:var(--brand)}
.cred td{padding:5px 8px;font-size:13px}
.wide{grid-column:1/-1}
::placeholder{text-transform:none;color:#8a96a3}
.nw{white-space:nowrap}
@media (max-width:480px){.phone{border:0;border-radius:0;margin:0;padding:12px}}
</style>
</head>

<div id="fatal" style="display:none;background:#fdeceb;color:#c8372d;padding:12px 16px;font:14px/1.4 system-ui,sans-serif;border-bottom:1px solid #f1b9b5"></div>
<div id="app"><p style="font:15px/1.5 system-ui,sans-serif;padding:24px;color:#5d6b7a;max-width:560px;margin:0 auto">Loading&hellip; If this message does not go away, your browser is blocking scripts in local files. Open this file in Chrome or Edge (right-click the file, then Open with), or tell the person who sent it to you.</p></div>
<noscript><p style="font:15px/1.5 system-ui,sans-serif;padding:24px;color:#c8372d;max-width:560px;margin:0 auto">JavaScript is turned off in this browser, so this demo cannot run. Turn it on, or open the file in Chrome or Edge.</p></noscript>
<script>
// Plain old syntax on purpose: this must work even if the main script fails to load or run.
window.addEventListener('error', function (e) {
  var f = document.getElementById('fatal');
  if (f) { f.style.display = 'block'; f.textContent = 'Something went wrong: ' + (e.message || 'unknown error') + '. Please send this message to the person who gave you this file.'; }
});
</script>
<script>
(function () {
'use strict';

/* ================= helpers ================= */
const APP_NAME = 'Site manpower and worker health declaration';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const hhmm = (m) => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const dayNum = (s) => { const [y, m, d] = s.split('-').map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 864e5); };
const dateStr = (dn) => { const d = new Date(dn * 864e5); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); };
const todayStr = () => { const n = new Date(); return n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate()); };
const prettyDate = (dn) => new Date(dn * 864e5).toLocaleDateString('en-SG', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
const ymOf = (dn) => dateStr(dn).slice(0, 7);
const monthStart = (ym) => dayNum(ym + '-01');
const monthEnd = (ym) => { const [y, m] = ym.split('-').map(Number); return Math.floor(Date.UTC(y, m, 0) / 864e5); };
const prettyMonth = (ym) => { const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString('en-SG', { month: 'long', year: 'numeric', timeZone: 'UTC' }); };
const pct = (a, b) => (b > 0 ? ((a / b) * 100).toFixed(1) + '%' : '–');
const nowMin = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
const stamp = (iso) => { const d = new Date(iso); return pad(d.getDate()) + ' ' + d.toLocaleString('en-GB', { month: 'short' }) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dash = '<span class="muted">–</span>';

// Deterministic hash -> [0,1). The same inputs always give the same fictional world.
function hrand(a, b, c) {
  let h = 2166136261 ^ a;
  h = Math.imul(h ^ b, 16777619);
  h = Math.imul(h ^ c, 16777619);
  h ^= h >>> 15; h = Math.imul(h, 2246822519);
  h ^= h >>> 13; h = Math.imul(h, 3266489917);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const pick = (arr, a, b, c) => arr[Math.floor(hrand(a, b, c) * arr.length)];

/* ================= fictional world ================= */
const GROUPS = [{ code: 'JRL', name: 'Jurong Region Line' }, { code: 'CRL', name: 'Cross Island Line' }];
const CONTRACTS = [
  { id: 1, code: 'JRL111', group: 'JRL', name: 'JRL Station A', main: 'Meridian Civil Pte Ltd', addr: '12 Woodlands Ave 9' },
  { id: 2, code: 'JRL112', group: 'JRL', name: 'JRL Station B', main: 'Tanjong Builders Pte Ltd', addr: '40 Bukit Batok Rd' },
  { id: 3, code: 'JRL113', group: 'JRL', name: 'JRL Station C', main: 'Harbourstone Engineering Pte Ltd', addr: '5 Tuas South Link' },
  { id: 4, code: 'CRL111', group: 'CRL', name: 'CRL Station A', main: 'Kestrel Infrastructure Pte Ltd', addr: '88 Yio Chu Kang Rd' },
  { id: 5, code: 'CRL112', group: 'CRL', name: 'CRL Station B', main: 'Lakeshore Engineering Pte Ltd', addr: '2 Loyang Way' },
  { id: 6, code: 'CRL113', group: 'CRL', name: 'CRL Station C', main: 'Orchid Bay Construction Pte Ltd', addr: '17 Pasir Ris Dr 1' },
].map((c) => Object.assign(c, { token: c.code.toLowerCase() + '-demo' }));
const POOL = [['Apex Rebar Works', 'Rebar'], ['Lion Formwork', 'Formwork'], ['Everbright M&E', 'M&E'], ['Sunrise Scaffolding', 'Scaffolding'],
  ['Delta Concreting', 'Concrete'], ['Bluewater Piling', 'Piling'], ['Northstar Waterproofing', 'Waterproofing'], ['Granite Excavation', 'Earthworks']];
const FIRST = ['Rahman', 'Kumar', 'Wei', 'Aung', 'Hossain', 'Ravi', 'Ming', 'Thura', 'Islam', 'Suresh', 'Jun', 'Kyaw', 'Alam', 'Murugan', 'Hao', 'Zaw', 'Karim', 'Siva', 'Lei', 'Min'];
const LAST = ['Md', 'Abdul', 'Raj', 'Chen', 'Tan', 'Lin', 'Ali', 'Nair', 'Htet', 'Uddin', 'Pillai', 'Zhang', 'Win', 'Miah', 'Das'];
const HEALTH_NOTES = ['Fever', 'Headache and dizziness', 'Sore throat', 'Stomach pain', 'Back pain', 'Feeling weak'];
const CLINIC_NOTES = ['Polyclinic: cut on right hand', 'Clinic: sprained ankle', 'Clinic: eye irritation from dust'];
const INJURY_NOTES = ['This site: minor cut on left hand', 'This site: bruised knee', 'This site: slipped on wet floor, sore wrist'];
const NATURE = ['Rebar fixing', 'Formwork erection', 'Concrete pour', 'Scaffold erection', 'Excavation', 'M&E installation'];
const SUBJECT = ['Working at height', 'Housekeeping', 'Lifting operations', 'Heat stress', 'PPE use', 'Hot work permits'];
const ITEMS = ['Harness checks and anchor points', 'Clear walkways and waste disposal', 'Signalman duties and exclusion zones', 'Hydration breaks and shaded rest area', 'Helmet, boots and gloves inspection', 'Fire watch and extinguisher locations'];

const SUBCONS = [], WORKERS = [], byContract = {}, subsOf = {}, groupContracts = {};
CONTRACTS.forEach((c) => {
  byContract[c.id] = []; subsOf[c.id] = [];
  (groupContracts[c.group] = groupContracts[c.group] || []).push(c);
  const n = 3 + (c.id % 3);
  const order = POOL.map((p, i) => ({ p, k: hrand(c.id, i, 10) })).sort((a, b) => a.k - b.k).slice(0, n);
  let rn = 0;
  order.forEach((o) => {
    const s = { id: SUBCONS.length + 1, cid: c.id, name: o.p[0], trade: o.p[1] };
    SUBCONS.push(s); subsOf[c.id].push(s);
    const count = 50 + Math.floor(hrand(s.id, 0, 11) * 60);
    for (let i = 0; i < count; i++) {
      rn++;
      const w = { id: WORKERS.length + 1, cid: c.id, sid: s.id,
        last4: String((rn * 7) % 1000).padStart(3, '0') + String.fromCharCode(65 + ((rn * 11) % 26)),
        name: FIRST[(rn * 7 + c.id) % 20] + ' ' + LAST[(rn * 13 + c.id * 3) % 15] };
      WORKERS.push(w); byContract[c.id].push(w);
    }
  });
});
const subById = (id) => SUBCONS[id - 1];
const contractById = (id) => CONTRACTS[id - 1];
const contractByCode = (code) => CONTRACTS.find((c) => c.code === code);
const contractByToken = (t) => CONTRACTS.find((c) => c.token === t);
const supName = (sid) => FIRST[(sid * 3) % 20] + ' ' + LAST[(sid * 5) % 15];

// Dummy log-ins (demo only).
const LTA_LOGIN = { user: 'lta.officer', pass: 'lta-demo-123' };
const contractorLogin = (c) => ({ user: c.code.toLowerCase(), pass: 'contractor-demo' });

const RECIPIENTS = (c) => [
  { ch: 'email', name: 'Safety Officer — Tan', to: 'safety.' + c.code.toLowerCase() + '@example.com' },
  { ch: 'telegram', name: 'Safety Officer — Tan', to: 'Telegram chat 100000001' },
  { ch: 'whatsapp', name: 'Site Manager — Lim', to: '+65 9000 0001' },
];
const CH_LABEL = { email: 'Email', telegram: 'Telegram', whatsapp: 'WhatsApp' };
const FAKE_LINK = 'https://manpower.example/site';

/* ================= who checked in on a day ================= */
let todayDn = dayNum(todayStr());

// History is generated, not stored: the same worker/day always gives the same declaration.
function baseEntry(w, dn) {
  const wd = new Date(dn * 864e5).getUTCDay();
  if (!(hrand(w.id, dn, 1) < (wd === 0 ? 0.35 : 0.85))) return null;
  const type = hrand(w.id, dn, 2) < 0.9 ? 'start' : 'mid';
  const inMin = (type === 'start' ? 420 : 690) + Math.floor(hrand(w.id, dn, 3) * 90);
  let outMin = null;
  if (dn === todayDn) { if (hrand(w.id, dn, 4) < 0.25) outMin = Math.min(1439, inMin + 180 + Math.floor(hrand(w.id, dn, 5) * 120)); }
  else if (hrand(w.id, dn, 4) >= 0.01) outMin = 1050 + Math.floor(hrand(w.id, dn, 5) * 90);
  const bad = hrand(w.id, dn, 6) < 0.02, clinic = hrand(w.id, dn, 9) < 0.004, injury = hrand(w.id, dn, 16) < 0.006;
  const sup = hrand(w.id, 0, 20) < 0.06;
  const e = { id: 'b' + w.id + '-' + dn, cid: w.cid, sid: w.sid, name: w.name, last4: w.last4, type, inMin, outMin,
    newToSite: hrand(w.id, dn, 8) < 0.05, desig: sup ? 'supervisor' : 'worker', supervisor: sup ? '' : supName(w.sid),
    health: bad ? 'bad' : 'good', healthNote: bad ? pick(HEALTH_NOTES, w.id, dn, 7) : '',
    clinic, clinicNote: clinic ? pick(CLINIC_NOTES, w.id, dn, 17) : '', injury, injuryNote: injury ? pick(INJURY_NOTES, w.id, dn, 18) : '' };
  if (sup) e.toolbox = { no: 1 + Math.floor(hrand(w.id, dn, 11) * 60), att: 8 + Math.floor(hrand(w.id, dn, 12) * 35), nature: pick(NATURE, w.id, dn, 13), subject: pick(SUBJECT, w.id, dn, 14), items: pick(ITEMS, w.id, dn, 15) };
  return e;
}

/* ================= saved changes (this browser only) ================= */
const KEY = 'dtbm-demo-v2';
let store = null, storageOk = true;
const blank = () => ({ checkins: [], mod: {}, follow: {}, alerts: [], audit: [], pins: {}, attempts: {}, nextId: 1, nextAlert: 1 });
function loadStore() {
  try { const s = localStorage.getItem(KEY); store = Object.assign(blank(), s ? JSON.parse(s) : {}); }
  catch (e) { storageOk = false; if (!store) store = blank(); }
}
function saveStore() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { storageOk = false; } }

let session = null, claim = null, flash = null, loginErr = null, lastAudit = '';
const SS = (k, v) => { try { if (v === undefined) return JSON.parse(sessionStorage.getItem(k) || 'null'); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* in-memory only */ } return null; };

function entriesFor(cid, dn) {
  const out = [];
  for (const w of byContract[cid]) { const e = baseEntry(w, dn); if (e) out.push(store.mod[e.id] ? Object.assign(e, store.mod[e.id]) : e); }
  for (const n of store.checkins) if (n.cid === cid && n.dn === dn) out.push(store.mod[n.id] ? Object.assign({}, n, store.mod[n.id]) : n);
  return out;
}
const isFollowed = (e, dn) => (e.id in store.follow ? store.follow[e.id] : ((e.health === 'bad' || e.clinic || e.injury) && dn < todayDn));
const injured = (e) => e.clinic || e.injury;
function sum(list) {
  const s = { total: list.length, start: 0, mid: 0, still: 0, unwell: 0, injury: 0 };
  for (const e of list) { if (e.type === 'start') s.start++; else s.mid++; if (e.outMin == null) s.still++; if (e.health === 'bad') s.unwell++; if (injured(e)) s.injury++; }
  return s;
}
function trend(cids, dn) {
  const pts = [];
  for (let d = dn - 13; d <= dn; d++) { let t = 0, u = 0; for (const cid of cids) for (const e of entriesFor(cid, d)) { t++; if (e.health === 'bad') u++; } pts.push({ d, t, u }); }
  return pts;
}
const sitePin = (cid, dn) => store.pins[cid + '|' + dn] || String(1000 + Math.floor(hrand(cid, dn, 30) * 9000));

/* ================= alerts (simulated) ================= */
function flagText(e) {
  const p = [];
  if (e.health === 'bad') p.push('reported unwell');
  if (e.clinic) p.push('reported a workplace-injury clinic visit');
  if (e.injury) p.push('reported an injury');
  return p.join(' and ');
}
function addAlerts(c, key, body, test, onlyCh) {
  const at = new Date().toISOString();
  const made = RECIPIENTS(c).filter((r) => !onlyCh || r.ch === onlyCh).map((r) => ({ id: store.nextAlert++, cid: c.id, key, ch: r.ch, name: r.name, to: r.to, body, at, test: !!test }));
  store.alerts.unshift(...made);
  store.alerts = store.alerts.slice(0, 300);
  return made;
}
function preview(a) {
  const c = contractById(a.cid), text = esc(a.body.replace(' Details: ' + FAKE_LINK, ''));
  if (a.ch === 'email') return '<div class="pv email"><div class="ch">Email preview</div><div class="hdr"><b>Health declaration alerts</b> &lt;alerts@manpower.example&gt;<br>To: ' + esc(a.to) +
    '<br><b>Subject:</b> ' + esc(c.code + (a.test ? ': test alert' : ': worker health declaration alert')) + '</div><div>' + text + '</div><p style="margin:8px 0 0"><span class="btn small">Open dashboard</span> <span class="muted">' + esc(FAKE_LINK) + '</span></p></div>';
  if (a.ch === 'telegram') return '<div class="pv tg"><div class="ch">Telegram preview</div><div class="who">Health declaration bot</div><div>' + esc(a.body) + '</div></div>';
  return '<div class="pv wa"><div class="ch">WhatsApp preview</div><div class="who">Health declaration alert</div><div>Health declaration alert: ' + esc(a.body) + '</div></div>';
}

/* ================= routing ================= */
function parseHash() {
  const h = location.hash.replace(/^#/, '') || '/';
  const i = h.indexOf('?');
  return { path: i < 0 ? h : h.slice(0, i), q: new URLSearchParams(i < 0 ? '' : h.slice(i + 1)) };
}
function dateParam(q) {
  const v = q.get('date');
  if (v && /^\d{4}-\d{2}-\d{2}$/.test(v)) { const d = dayNum(v); if (d <= todayDn && d >= todayDn - 29) return d; }
  return todayDn;
}
function monthParam(q) {
  const v = q.get('month'), cur = ymOf(todayDn), prev = ymOf(monthStart(cur) - 1);
  return v && /^\d{4}-\d{2}$/.test(v) && v >= prev && v <= cur ? v : cur;
}
const withDate = (path, dn) => '#' + path + '?date=' + dateStr(dn);
const go = (hash) => { if (location.hash === hash) render(); else location.hash = hash; };
const homeHash = () => (session ? (session.role === 'authority' ? '#/authority' : '#/site') : '#/');

/* ================= building blocks ================= */
function banner() {
  return '<div class="demo-banner">DEMO · fictional data · stored in this browser only · not a secure system<button data-act="reset">Reset demo data</button>' +
    (storageOk ? '' : '<br>Your browser is blocking storage, so changes last only until you close this tab.') + '</div>';
}
function topbar() {
  if (!session) return '';
  const c = session.role === 'contractor' ? contractById(session.cid) : null;
  return '<header class="topbar"><a class="brand" href="' + homeHash() + '">' + esc(APP_NAME) + '</a><span class="small" style="opacity:.8">' + (c ? 'Contractor · ' + esc(c.main) : 'LTA') +
    '</span><div class="who"><span>' + esc(session.user) + '</span><button data-act="logout">Log out</button></div></header>';
}
const backLink = (hash) => '<a class="btn ghost small noprint" href="' + hash + '">← Back</a>';
const backLogout = () => '<button class="btn ghost small noprint" data-act="logout">← Back</button>';
function datePicker(dn) {
  return '<form class="inline noprint" data-form="goto-date"><input type="date" name="date" id="datepick" value="' + dateStr(dn) + '" min="' + dateStr(todayDn - 29) + '" max="' + dateStr(todayDn) + '" aria-label="Date"><button class="btn ghost" type="submit">View</button></form>';
}
function monthPicker(ym) {
  const cur = ymOf(todayDn), prev = ymOf(monthStart(cur) - 1);
  return '<form class="inline noprint" data-form="goto-month"><input type="month" name="month" value="' + ym + '" min="' + prev + '" max="' + cur + '" aria-label="Month"><button class="btn ghost" type="submit">View</button></form>';
}
const kpi = (label, value, sub, tone) => '<div class="kpi ' + (tone || '') + '"><div class="label">' + label + '</div><div class="value tnum">' + value + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
const barHtml = (v, max) => '<div class="bar"><div style="width:' + (max > 0 ? Math.round((v / max) * 100) : 0) + '%"></div></div>';

function trendSvg(points, label) {
  const W = 560, H = 160, padL = 22, max = Math.max(1, ...points.map((p) => p.t)), bw = (W - padL) / points.length;
  let g = '';
  points.forEach((p, i) => {
    const h = (p.t / max) * (H - 16), uh = (p.u / max) * (H - 16), x = padL + i * bw + Math.min(3, bw / 6), w = Math.max(2, bw - Math.min(6, bw / 3));
    g += '<g><title>' + dateStr(p.d) + ': ' + p.t + ' workers, ' + p.u + ' unwell</title><rect x="' + x + '" y="' + (H - h) + '" width="' + w + '" height="' + h + '" rx="2" fill="var(--bar)" opacity=".85"/>' +
      (p.u > 0 ? '<rect x="' + x + '" y="' + (H - Math.max(uh, 2)) + '" width="' + w + '" height="' + Math.max(uh, 2) + '" fill="var(--bad)"/>' : '') +
      (points.length <= 16 || i % 2 === 0 ? '<text x="' + (x + w / 2) + '" y="' + (H + 13) + '" text-anchor="middle" class="axis">' + dateStr(p.d).slice(8) + '</text>' : '') + '</g>';
  });
  return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + (H + 18) + '" role="img" aria-label="' + esc(label || 'Headcount') + '">' + g +
    '<text x="0" y="10" class="axis">' + max + '</text><line x1="' + padL + '" x2="' + W + '" y1="' + H + '" y2="' + H + '" stroke="var(--line)"/></svg>' +
    '<div class="small muted"><span style="color:var(--bar)">■</span> workers checked in &nbsp;<span style="color:var(--bad)">■</span> unwell</div></div>';
}
const alertBadge = '<span class="pill" title="Demo mode: message recorded, not sent">Demo 3</span>';
const who = (e) => esc(e.name) + (e.newToSite ? ' <span class="pill warn">New to site</span>' : '') + '<div class="small muted">…' + esc(e.last4) + ' · ' + (e.desig === 'supervisor' ? 'Supervisor' : 'Worker') + '</div>';

/* Daily / monthly switch, shared by the contractor page and the authority's contract page. */
function viewSwitch(base, mode, dn, ym) {
  return '<div class="seg noprint"><a class="' + (mode === 'day' ? 'on' : '') + '" href="' + withDate(base, dn) + '">Daily</a><a class="' + (mode === 'month' ? 'on' : '') + '" href="#' + base + '?view=month&month=' + ym + '">Monthly</a></div>';
}

/* One site, one day. No roster numbers: the roster is dynamic. */
function siteDay(c, dn, editable) {
  const list = entriesFor(c.id, dn), t = sum(list), isToday = dn === todayDn;
  const rows = subsOf[c.id].map((s) => Object.assign({ s }, sum(list.filter((e) => e.sid === s.id)))).sort((a, b) => b.total - a.total || a.s.name.localeCompare(b.s.name));
  const max = Math.max(1, ...rows.map((r) => r.total));
  const unwell = list.filter((e) => e.health === 'bad').map((e) => ({ e, f: isFollowed(e, dn) })).sort((a, b) => a.f - b.f || a.e.inMin - b.e.inMin);
  const open = unwell.filter((u) => !u.f).length;
  const hurt = list.filter(injured).sort((a, b) => a.inMin - b.inMin);
  const stuck = list.filter((e) => e.outMin == null).sort((a, b) => subById(a.sid).name.localeCompare(subById(b.sid).name) || a.name.localeCompare(b.name));
  const tool = list.filter((e) => e.toolbox).sort((a, b) => subById(a.sid).name.localeCompare(subById(b.sid).name));

  let h = '<div class="kpis">' +
    kpi('Checked in', t.total, t.start + ' start · ' + t.mid + ' mid') +
    kpi(isToday ? 'Still on site' : 'Not checked out', t.still, (t.total - t.still) + ' checked out', !isToday && t.still > 0 ? 'warn' : '') +
    kpi('Unwell', t.unwell, pct(t.unwell, t.total) + ' of workers' + (open ? ' · ' + open + ' open' : ''), t.unwell > 0 ? 'bad' : '') +
    kpi('Injury / clinic', t.injury, 'reports declared', t.injury > 0 ? 'bad' : '') +
    kpi('Subcontractors', rows.filter((r) => r.total > 0).length, 'with check-ins') + '</div>';

  if (editable && isToday) {
    h += '<section class="card" style="margin-bottom:16px"><h2>Site PIN for today</h2><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><div class="pinbox" id="sitepin">' + esc(sitePin(c.id, dn)) + '</div>' +
      '<div class="small muted" style="flex:1 1 240px">Workers enter this PIN with their name and NRIC/FIN last 4 to check in and out. Tell it to workers at the gate; change it any time.</div>' +
      '<form class="inline" data-form="set-pin"><input name="pin" inputmode="numeric" maxlength="4" placeholder="New PIN" style="width:110px" aria-label="New site PIN"><button class="btn ghost" type="submit">Set PIN</button></form></div></section>';
  }
  h += '<div class="grid cols-2">';

  h += '<section class="card"><h2>Manpower by subcontractor</h2><div class="tablewrap"><table><thead><tr><th>Subcontractor</th><th class="barcell"></th><th class="num">In</th><th class="num">Start</th><th class="num">Mid</th><th class="num">On site</th><th class="num">Unwell</th></tr></thead><tbody>';
  rows.forEach((r) => { h += '<tr><td>' + esc(r.s.name) + '<div class="small muted">' + esc(r.s.trade) + '</div></td><td class="barcell">' + barHtml(r.total, max) +
    '</td><td class="num"><b>' + r.total + '</b></td><td class="num">' + r.start + '</td><td class="num">' + r.mid + '</td><td class="num">' + r.still + '</td><td class="num">' + (r.unwell ? '<span class="pill bad">' + r.unwell + '</span>' : 0) + '</td></tr>'; });
  h += '<tr><td><b>Total</b></td><td></td><td class="num"><b>' + t.total + '</b></td><td class="num">' + t.start + '</td><td class="num">' + t.mid + '</td><td class="num">' + t.still + '</td><td class="num"><b>' + t.unwell + '</b></td></tr></tbody></table></div></section>';

  h += '<section class="card"><h2>Last 14 days</h2>' + trendSvg(trend([c.id], dn), 'Headcount over the last 14 days') + '</section>';

  h += '<section class="card wide"><h2>Unwell workers <span class="pill bad">' + unwell.length + '</span></h2>';
  if (!unwell.length) h += '<p class="empty">Nobody declared their health condition as not good.</p>';
  else {
    h += '<div class="tablewrap list"><table><thead><tr><th>Worker</th><th>Subcontractor</th><th>In</th><th>Explanation</th><th>Alert</th><th>Follow-up</th></tr></thead><tbody>';
    unwell.forEach(({ e, f }) => {
      h += '<tr><td>' + who(e) + '</td><td>' + esc(subById(e.sid).name) + '</td><td class="tnum">' + hhmm(e.inMin) + '</td><td>' + (e.healthNote ? esc(e.healthNote) : dash) + '</td><td>' + alertBadge + '</td><td>' +
        (editable ? '<button class="btn small ' + (f ? 'ghost' : '') + '" data-act="follow" data-id="' + esc(e.id) + '">' + (f ? '✓ Done' : 'Mark done') + '</button>'
                  : (f ? '<span class="pill good">Done</span>' : '<span class="pill warn">Open</span>')) + '</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</section>';

  h += '<section class="card wide"><h2>Injury / clinic reports <span class="pill ' + (hurt.length ? 'bad' : '') + '">' + hurt.length + '</span></h2>';
  if (!hurt.length) h += '<p class="empty">No injuries or clinic visits declared.</p>';
  else {
    h += '<div class="tablewrap list"><table><thead><tr><th>Worker</th><th>Subcontractor</th><th>Clinic visit (24 h)</th><th>Injury (24 h)</th><th>Alert</th></tr></thead><tbody>';
    hurt.forEach((e) => { h += '<tr><td>' + who(e) + '</td><td>' + esc(subById(e.sid).name) + '</td><td>' + (e.clinic ? esc(e.clinicNote) : dash) + '</td><td>' + (e.injury ? esc(e.injuryNote) : dash) + '</td><td>' + alertBadge + '</td></tr>'; });
    h += '</tbody></table></div>';
  }
  h += '</section>';

  h += '<section class="card wide"><h2>' + (isToday ? 'Not yet exited' : 'Never checked out') + ' <span class="pill ' + (stuck.length && !isToday ? 'warn' : '') + '">' + stuck.length + '</span></h2>';
  if (!stuck.length) h += '<p class="empty">Everyone has checked out.</p>';
  else {
    h += '<div class="tablewrap list"><table><thead><tr><th>Worker</th><th>Subcontractor</th><th>Type</th><th>In</th></tr></thead><tbody>';
    stuck.forEach((e) => { h += '<tr><td>' + who(e) + '</td><td>' + esc(subById(e.sid).name) + '</td><td>' + (e.type === 'mid' ? '<span class="pill">Mid</span>' : 'Start') + '</td><td class="tnum">' + hhmm(e.inMin) + '</td></tr>'; });
    h += '</tbody></table></div>';
  }
  h += '</section>';

  h += '<section class="card wide"><h2>Toolbox meetings <span class="pill">' + tool.length + '</span></h2>';
  if (!tool.length) h += '<p class="empty">No toolbox meetings declared by supervisors.</p>';
  else {
    h += '<div class="tablewrap list"><table><thead><tr><th>Supervisor</th><th>Subcontractor</th><th class="num">Meeting no.</th><th class="num">Attendance</th><th>Nature of work</th><th>Subject / topic</th><th>Items discussed</th></tr></thead><tbody>';
    tool.forEach((e) => { h += '<tr><td>' + esc(e.name) + '<div class="small muted">…' + esc(e.last4) + '</div></td><td>' + esc(subById(e.sid).name) + '</td><td class="num">' + e.toolbox.no + '</td><td class="num">' + e.toolbox.att + '</td><td>' + esc(e.toolbox.nature) + '</td><td>' + esc(e.toolbox.subject) + '</td><td>' + esc(e.toolbox.items) + '</td></tr>'; });
    h += '</tbody></table></div>';
  }
  return h + '</section></div>';
}

/* One site, one month. */
function siteMonth(c, ym) {
  const end = Math.min(monthEnd(ym), todayDn), days = [];
  for (let d = monthStart(ym); d <= end; d++) days.push({ dn: d, list: entriesFor(c.id, d) });
  const totals = days.map((x) => x.list.length), manDays = totals.reduce((a, b) => a + b, 0), active = totals.filter((t) => t > 0).length;
  const peakI = totals.indexOf(Math.max(...totals)), all = days.flatMap((x) => x.list.map((e) => ({ e, dn: x.dn })));
  const unwell = all.filter((x) => x.e.health === 'bad'), hurt = all.filter((x) => injured(x.e));
  const rows = subsOf[c.id].map((s) => { const m = all.filter((x) => x.e.sid === s.id); return { s, md: m.length, un: m.filter((x) => x.e.health === 'bad').length, inj: m.filter((x) => injured(x.e)).length }; }).sort((a, b) => b.md - a.md);
  const max = Math.max(1, ...rows.map((r) => r.md));
  const points = days.map((x) => ({ d: x.dn, t: x.list.length, u: x.list.filter((e) => e.health === 'bad').length }));
  const cap = (arr) => arr.sort((a, b) => b.dn - a.dn).slice(0, 100);

  let h = '<div class="kpis">' + kpi('Man-days', manDays.toLocaleString('en-SG'), 'check-ins in ' + prettyMonth(ym)) +
    kpi('Average per day', active ? Math.round(manDays / active) : 0, 'over ' + active + ' days with check-ins') +
    kpi('Peak day', Math.max(0, ...totals), peakI >= 0 && days[peakI] ? prettyDate(days[peakI].dn) : '') +
    kpi('Unwell cases', unwell.length, pct(unwell.length, manDays) + ' of man-days', unwell.length ? 'bad' : '') +
    kpi('Injury / clinic', hurt.length, 'reports declared', hurt.length ? 'bad' : '') + '</div><div class="grid cols-2">';
  h += '<section class="card"><h2>Daily headcount — ' + esc(prettyMonth(ym)) + '</h2>' + trendSvg(points, 'Daily headcount for the month') + '</section>';
  h += '<section class="card wide"><h2>Manpower by subcontractor</h2><div class="tablewrap"><table><thead><tr><th>Subcontractor</th><th class="barcell"></th><th class="num">Man-days</th><th class="num">Avg / day</th><th class="num">Unwell</th><th class="num">Injury / clinic</th></tr></thead><tbody>';
  rows.forEach((r) => { h += '<tr><td>' + esc(r.s.name) + '<div class="small muted">' + esc(r.s.trade) + '</div></td><td class="barcell">' + barHtml(r.md, max) + '</td><td class="num"><b>' + r.md + '</b></td><td class="num">' + (active ? Math.round(r.md / active) : 0) + '</td><td class="num">' + (r.un ? '<span class="pill bad">' + r.un + '</span>' : 0) + '</td><td class="num">' + (r.inj ? '<span class="pill bad">' + r.inj + '</span>' : 0) + '</td></tr>'; });
  h += '</tbody></table></div></section>';
  const listCard = (title, arr, cols, cells) => {
    let s = '<section class="card"><h2>' + title + ' <span class="pill ' + (arr.length ? 'bad' : '') + '">' + arr.length + '</span></h2>';
    if (!arr.length) return s + '<p class="empty">None this month.</p></section>';
    s += '<div class="tablewrap list"><table><thead><tr>' + cols.map((x) => '<th>' + x + '</th>').join('') + '</tr></thead><tbody>';
    cap(arr.slice()).forEach((x) => { s += '<tr>' + cells(x) + '</tr>'; });
    return s + '</tbody></table></div>' + (arr.length > 100 ? '<p class="small muted">Showing the latest 100.</p>' : '') + '</section>';
  };
  h += listCard('Unwell cases', unwell, ['Date', 'Worker', 'Subcontractor', 'Explanation'], (x) => '<td class="tnum nw">' + dateStr(x.dn) + '</td><td>' + who(x.e) + '</td><td>' + esc(subById(x.e.sid).name) + '</td><td>' + (x.e.healthNote ? esc(x.e.healthNote) : dash) + '</td>');
  h += listCard('Injury / clinic reports', hurt, ['Date', 'Worker', 'Clinic visit', 'Injury'], (x) => '<td class="tnum nw">' + dateStr(x.dn) + '</td><td>' + who(x.e) + '</td><td>' + (x.e.clinic ? esc(x.e.clinicNote) : dash) + '</td><td>' + (x.e.injury ? esc(x.e.injuryNote) : dash) + '</td>');
  return h + '</div>';
}

/* ================= actions ================= */
function setClaim(id, cid) { claim = { id, cid, until: Date.now() + 15 * 60 * 1000 }; SS('dtbm-demo-claim', claim); }
const formData = (form) => Object.fromEntries(new FormData(form).entries());
const cleanName = (s) => String(s || '').trim().replace(/\s+/g, ' ').slice(0, 80);
const formError = (msg) => { const el = document.getElementById('formerr'); if (el) { el.innerHTML = '<div class="err">' + esc(msg) + '</div>'; el.scrollIntoView({ block: 'nearest' }); } };

// 5 wrong PINs on this device within 15 minutes locks the site's check-in screen.
function checkPin(c, pin) {
  const now = Date.now(), k = String(c.id), recent = (store.attempts[k] || []).filter((t) => now - t < 15 * 60 * 1000);
  if (recent.length >= 5) { store.attempts[k] = recent; saveStore(); return 'locked'; }
  if (pin === sitePin(c.id, todayDn)) { delete store.attempts[k]; saveStore(); return 'ok'; }
  recent.push(now); store.attempts[k] = recent; saveStore(); return 'wrong';
}
const PIN_MSG = { locked: 'Too many wrong PINs. Try again in 15 minutes, or ask your supervisor for the site PIN.', wrong: 'That PIN is not right for this site today. Ask your supervisor for the site PIN.' };

function validate(f, c) {
  const name = cleanName(f.name), last4 = String(f.last4 || '').trim().toUpperCase();
  if (!name) return 'Please enter your name.';
  if (!/^[0-9]{3}[A-Z]$/.test(last4)) return 'Enter the last 4 characters of your NRIC/FIN (e.g. 567A).';
  if (!/^[0-9]{4}$/.test(String(f.pin || '').trim())) return 'Enter the 4-digit site PIN.';
  if (f.type !== 'start' && f.type !== 'mid') return 'Please choose Start of day or Mid-day.';
  if (!subsOf[c.id].some((s) => String(s.id) === f.subcon)) return 'Please select your subcontractor.';
  if (!f.newsite) return 'Please answer “New to site?”.';
  if (!f.desig) return 'Please choose your designation.';
  if (f.desig === 'worker' && !cleanName(f.supervisor)) return 'Please enter your supervisor’s name.';
  if (!f.health) return 'Please answer “Is your health condition good?”.';
  if (f.health === 'no' && !String(f.health_note || '').trim()) return 'Please explain why your health condition is not good.';
  if (!f.clinic) return 'Please answer the doctor/clinic question.';
  if (f.clinic === 'yes' && !String(f.clinic_note || '').trim()) return 'Please say which doctor/clinic you visited and why.';
  if (!f.injury) return 'Please answer the injury question.';
  if (f.injury === 'yes' && !String(f.injury_note || '').trim()) return 'Please say which site you were injured at and what your injury is.';
  if (f.desig === 'supervisor') {
    if (!/^[0-9]+$/.test(String(f.tb_no || '').trim())) return 'Toolbox Meeting No. must be a whole number.';
    if (!/^[0-9]+$/.test(String(f.tb_att || '').trim())) return 'Toolbox Meeting Attendance must be a whole number.';
    if (!String(f.tb_nature || '').trim()) return 'Please enter the nature of work.';
    if (!String(f.tb_subject || '').trim()) return 'Please enter the subject/topic.';
    if (!String(f.tb_items || '').trim()) return 'Please enter the items discussed.';
  }
  if (f.declare !== 'yes') return 'Please confirm the declaration to check in.';
  return null;
}

function onSubmit(e) {
  const form = e.target.closest('[data-form]'); if (!form) return;
  e.preventDefault();
  const kind = form.getAttribute('data-form'), f = formData(form), { path } = parseHash();
  if (kind === 'goto-date') { const v = f.date; if (v) go(withDate(path, dayNum(v))); return; }
  if (kind === 'goto-month') { if (f.month) go('#' + path + '?view=month&month=' + f.month); return; }
  if (kind === 'login-lta') {
    if (f.user === LTA_LOGIN.user && f.pass === LTA_LOGIN.pass) { session = { role: 'authority', user: LTA_LOGIN.user }; SS('dtbm-demo-session', session); return go('#/authority'); }
    loginErr = 'Wrong username or password. Use the dummy credentials shown below.'; return render();
  }
  if (kind === 'login-contractor') {
    const c = CONTRACTS.find((x) => contractorLogin(x).user === String(f.user || '').trim().toLowerCase() && contractorLogin(x).pass === f.pass);
    if (c) { session = { role: 'contractor', cid: c.id, user: contractorLogin(c).user }; SS('dtbm-demo-session', session); return go('#/site'); }
    loginErr = 'Wrong username or password. Use one of the dummy credentials shown below.'; return render();
  }
  if (kind === 'set-pin') {
    if (!session || session.role !== 'contractor') return;
    const p = String(f.pin || '').trim();
    if (!/^[0-9]{4}$/.test(p)) { flash = null; const i = form.querySelector('input'); if (i) { i.value = ''; i.placeholder = '4 digits'; i.focus(); } return; }
    store.pins[session.cid + '|' + todayDn] = p; delete store.attempts[String(session.cid)]; saveStore(); return render();
  }
  const c = path.startsWith('/checkin/') ? contractByToken(path.split('/')[2]) : null; if (!c) return;
  if (kind === 'checkout') {
    const name = cleanName(f.name), last4 = String(f.last4 || '').trim().toUpperCase();
    if (!name || !/^[0-9]{3}[A-Z]$/.test(last4) || !/^[0-9]{4}$/.test(String(f.pin || '').trim())) return formError('Enter your name, the last 4 characters of your NRIC/FIN, and the 4-digit site PIN.');
    const r = checkPin(c, String(f.pin).trim()); if (r !== 'ok') return formError(PIN_MSG[r]);
    const m = entriesFor(c.id, todayDn).find((x) => x.last4 === last4 && x.name.toLowerCase() === name.toLowerCase() && x.outMin == null);
    if (!m) return formError('No active check-in found for these details today. Check the spelling of your name and NRIC/FIN.');
    store.mod[m.id] = Object.assign({}, store.mod[m.id], { outMin: Math.min(1439, Math.max(nowMin(), m.inMin + 1)) }); saveStore(); setClaim(m.id, c.id); return render();
  }
  if (kind === 'checkin') {
    const err = validate(f, c); if (err) return formError(err);
    const pr = checkPin(c, String(f.pin).trim()); if (pr !== 'ok') return formError(PIN_MSG[pr]);
    const name = cleanName(f.name), last4 = String(f.last4).trim().toUpperCase();
    if (entriesFor(c.id, todayDn).some((x) => x.last4 === last4 && x.name.toLowerCase() === name.toLowerCase())) return formError('You have already checked in at this site today. Use Check out when you leave.');
    const en = { id: 'n' + store.nextId++, cid: c.id, dn: todayDn, sid: Number(f.subcon), name, last4, type: f.type, inMin: nowMin(), outMin: null, newToSite: f.newsite === 'yes',
      desig: f.desig, supervisor: f.desig === 'worker' ? cleanName(f.supervisor) : '', health: f.health === 'yes' ? 'good' : 'bad', healthNote: f.health === 'no' ? String(f.health_note).trim() : '',
      clinic: f.clinic === 'yes', clinicNote: f.clinic === 'yes' ? String(f.clinic_note).trim() : '', injury: f.injury === 'yes', injuryNote: f.injury === 'yes' ? String(f.injury_note).trim() : '' };
    if (f.desig === 'supervisor') en.toolbox = { no: Number(f.tb_no), att: Number(f.tb_att), nature: String(f.tb_nature).trim(), subject: String(f.tb_subject).trim(), items: String(f.tb_items).trim() };
    store.checkins.push(en);
    if (flagText(en)) addAlerts(c, en.id, c.code + ': ' + en.name + ' (…' + en.last4 + ', ' + subById(en.sid).name + ') ' + flagText(en) + ' at ' + hhmm(en.inMin) + '. Details: ' + FAKE_LINK, false);
    saveStore(); setClaim(en.id, c.id); return render();
  }
}

function onClick(e) {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.getAttribute('data-act');
  if (act === 'to-login') return go('#/login/' + el.getAttribute('data-kind'));
  if (act === 'fill-cred') { const f = el.closest('main').querySelector('form'); f.querySelector('[name=user]').value = el.getAttribute('data-u'); f.querySelector('[name=pass]').value = el.getAttribute('data-p'); return; }
  if (act === 'open-worker') return go('#/checkin/' + contractByCode(document.getElementById('wpick').value).token);
  if (act === 'open-worker-tab') {
    e.preventDefault();
    const token = el.getAttribute('data-token') || contractByCode(document.getElementById('wpick').value).token;
    window.open(location.href.split('#')[0] + '#/checkin/' + token, '_blank'); return;
  }
  if (act === 'logout') { session = null; SS('dtbm-demo-session', null); return go('#/'); }
  if (act === 'reset') { store = blank(); try { localStorage.removeItem(KEY); } catch (er) { /* ignore */ } claim = null; SS('dtbm-demo-claim', null); lastAudit = ''; flash = null; return render(); }
  if (act === 'fill-demo') {
    const f = el.closest('main, body').querySelector('form'); if (!f) return;
    const set = (n, v) => { const i = f.querySelector('[name=' + n + ']'); if (i) i.value = v; };
    set('name', 'Demo Worker'); set('last4', '123A'); set('pin', document.getElementById('demopin').textContent); return;
  }
  if (act === 'follow' && session && session.role === 'contractor') {
    const id = el.getAttribute('data-id'), en = entriesFor(session.cid, dateParam(parseHash().q)).find((x) => x.id === id);
    if (!en) return; // contractors can only touch their own site
    store.follow[id] = !isFollowed(en, dateParam(parseHash().q)); saveStore(); return render();
  }
  if (act === 'alert-test' && session && session.role === 'contractor') {
    const c = contractById(session.cid);
    addAlerts(c, null, c.code + ': test alert sent by ' + session.user + '. Health declaration alerts for this site will arrive here. Details: ' + FAKE_LINK, true, el.getAttribute('data-ch'));
    saveStore(); flash = 'Test alert recorded in the log below (demo mode: not actually sent).'; return render();
  }
  if (act === 'checkout' && claim) {
    const en = entriesFor(claim.cid, todayDn).find((x) => x.id === claim.id);
    if (en && en.outMin == null) { store.mod[en.id] = Object.assign({}, store.mod[en.id], { outMin: Math.min(1439, Math.max(nowMin(), en.inMin + 1)) }); saveStore(); }
    return render();
  }
  if (act === 'done') { claim = null; SS('dtbm-demo-claim', null); return render(); }
}

// Show/hide the questions that depend on an earlier answer; enable Check in only after the declaration.
function syncForm(form) {
  form.querySelectorAll('[data-if]').forEach((el) => {
    const [n, v] = el.getAttribute('data-if').split('='), cur = form.querySelector('input[name="' + n + '"]:checked'), on = !!cur && cur.value === v;
    el.classList.toggle('hidden', !on);
    el.querySelectorAll('input,textarea,select').forEach((i) => { i.disabled = !on; });
  });
  const d = form.querySelector('input[name=declare]'), b = form.querySelector('[data-submit]');
  if (d && b) b.disabled = !d.checked;
}

/* ================= render ================= */
function afterRender() { document.querySelectorAll('form[data-form=checkin]').forEach(syncForm); }
function render() {
  todayDn = dayNum(todayStr());
  const { path, q } = parseHash(), app = document.getElementById('app'), redirect = (h) => { location.replace(h); };
  document.title = APP_NAME;
  if (path.startsWith('/checkin/')) { const p = path.split('/'); app.innerHTML = workerPage(p[2], p[3] === 'out'); afterRender(); return; }
  if (!session) { app.innerHTML = banner() + (path === '/login/lta' ? loginForm('lta') : path === '/login/contractor' ? loginForm('contractor') : loginHome()); return; }
  const authority = session.role === 'authority';
  if (path === '/' || path.startsWith('/login')) return redirect(homeHash());
  if (path.startsWith('/authority') && !authority) return redirect('#/site');
  if (path.startsWith('/site') && authority) return redirect('#/authority');
  let page;
  if (path === '/site') page = sitePage(q);
  else if (path === '/site/settings') page = settingsPage();
  else if (path === '/authority') page = overviewPage(q);
  else if (path === '/authority/audit') page = auditPage();
  else if (path.startsWith('/authority/g/')) page = groupPage(path.split('/')[3].toUpperCase(), q);
  else if (path.startsWith('/authority/c/')) {
    const code = path.split('/')[3].toUpperCase(), dn = dateParam(q), k = code + dn;
    if (contractByCode(code) && k !== lastAudit) { lastAudit = k; store.audit.unshift({ at: new Date().toISOString(), user: session.user, action: 'view_site_names:' + (q.get('view') === 'month' ? monthParam(q) : dateStr(dn)), code }); store.audit = store.audit.slice(0, 200); saveStore(); }
    page = contractPage(code, q);
  } else return redirect(homeHash());
  app.innerHTML = banner() + page;
}

/* ================= start ================= */
try { localStorage.setItem(KEY + '-probe', '1'); localStorage.removeItem(KEY + '-probe'); } catch (e) { storageOk = false; }
loadStore();
session = SS('dtbm-demo-session'); claim = SS('dtbm-demo-claim');
document.addEventListener('click', onClick);
document.addEventListener('submit', onSubmit);
document.addEventListener('change', (e) => { const f = e.target.closest('form[data-form=checkin]'); if (f) syncForm(f); });
window.addEventListener('hashchange', () => { flash = null; loginErr = null; render(); });
// Another tab of this browser changed the demo data (e.g. a worker checked in): refresh dashboards.
window.addEventListener('storage', (e) => {
  if (e.key !== KEY && e.key !== null) return;
  loadStore();
  if (!parseHash().path.startsWith('/checkin/')) render();
});
render();
})();
</script>
